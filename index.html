<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>茂原ベース スマート農園 WebAR管理プロトタイプ</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <script>
      // ------------------------------------------------------------------
      // 1) 圃場データ（将来的にGoogleスプレッドシート連携を想定したJSON構造）
      //    畝番号・作物名・品種・定植日・ステータスを1レコードとして定義。
      //    TODO: 本番では fetch() で Google Apps Script の Web App
      //          （スプレッドシートをJSON化して返すエンドポイント）から取得する形に置き換える。
      //
      //    【パス運用ルール】このファイルはDropbox経由で複数端末（PC/スマホ等）
      //    から開いてテストするため、ローカルアセットは必ず index.html から見た
      //    相対パスで指定すること（例: "models/potato-degima.glb"）。
      //    "C:\Users\...\models\x.glb" のような絶対パスは端末ごとに同期先の
      //    パスが変わるため使用しない。
      // ------------------------------------------------------------------
      const FIELD_DEPTH = 7.0;                 // 畝の奥行き(m)
      const ITEM_Z_POSITIONS = [2.5]; // 畝1本につき1箇所、看板と同じく手前側（通路に近い側）に配置

      // ------------------------------------------------------------------
      // 作物ごとの生育タイムライン（現状はWikimedia Commonsのフリー素材で代用）。
      // aboveStages: 経過日数(day)ごとの地上部の見た目の切り替え点。
      //   note は将来「自分で撮った写真＋その日のメモ」に差し替えるための場所（今は空）。
      // below: 地下部（芋・さや）は1枚の代表写真をスケールだけ変えて使い回す。
      // TODO: 将来的には aboveStages / below を自分で撮影した写真＋撮影日＋メモの
      //       配列（GitHubリポジトリの photos/ 以下）に置き換える。
      // ------------------------------------------------------------------
      const CROP_PHOTOS = {
        potato: {
          aboveStages: [
            { day: 0, url: 'https://upload.wikimedia.org/wikipedia/commons/7/7a/Aardappel_Dor%C3%A9_poters_%28Solanum_tuberosum_seed_potatoes%29.jpg', label: '定植（種芋）', note: '作業: 畝立てを行い、浴光育芽させた種芋を30cm間隔で植え付け。\n天候: 晴れ、日中の気温15℃前後。\n土壌: やや湿り気があり、排水性は良好。\nメモ: 植え付け後はたっぷり灌水。次回は2週間後に発芽状況を確認予定。' },
            { day: 20, url: 'https://upload.wikimedia.org/wikipedia/commons/a/a0/Potato_sprouts.jpg', label: '発芽', note: '作業: 各株で生育の良い芽を2〜3本残し、それ以外は芽かき。\n天候: くもり時々晴れ、朝晩は肌寒い。\n生育: 草丈10cm前後、葉色は良好。\nメモ: 遅霜の心配がなくなるまで敷きわらで防寒。次は開花期に追肥予定。' },
            { day: 45, url: 'https://upload.wikimedia.org/wikipedia/commons/d/df/Solanum_tuberosum_flower.JPG', label: '開花期', note: '作業: 化成肥料を追肥し、株元に土寄せ。\n天候: 晴天が続き、気温も安定。\n生育: つぼみが色づき始め、開花も間近。\nメモ: 開花後はテントウムシダマシの食害に注意して観察を継続。' },
            { day: 70, url: 'https://upload.wikimedia.org/wikipedia/commons/1/12/Potato_plant.jpg', label: '生育後期', note: '作業: 下葉の黄変を確認し、傷んだ葉を除去。\n天候: 蒸し暑い日が続く。降雨後は排水路を確認。\n生育: 地上部はピークを過ぎ、地下の芋の肥大が進行中。\nメモ: 収穫の目安として茎葉の枯れ具合を毎週チェック。' },
            { day: 95, url: 'https://upload.wikimedia.org/wikipedia/commons/f/f3/Potatoes.jpg', label: '収穫', note: '作業: 晴天が3日続いたタイミングで掘り取りを実施。\n天候: 快晴、掘り取りには絶好の条件。\n収量: 想定通りの大きさの芋が多数収穫できた。\nメモ: 掘り取り後は数日陰干しし、土を落としてから保管。' }
          ],
          below: 'https://upload.wikimedia.org/wikipedia/commons/f/f3/Potatoes.jpg',
          daysToHarvest: 95
        },
        peanut: {
          aboveStages: [
            { day: 0, url: 'https://upload.wikimedia.org/wikipedia/commons/2/2f/Organic_peanut_seeds.jpg', label: '播種', note: '作業: 畝立て後、種を3〜4cm間隔で播種。\n天候: 晴れ、地温が十分に上がってから作業。\n土壌: 排水性の良い砂質壌土を選定。\nメモ: 発芽まで乾燥させすぎないよう適度に灌水。' },
            { day: 25, url: 'https://upload.wikimedia.org/wikipedia/commons/2/28/Peanut_Sprout.jpg', label: '発芽', note: '作業: 雑草が目立ってきたため中耕・除草を実施。\n天候: 晴れときどきくもり。\n生育: 発芽は概ね揃い、本葉が展開中。\nメモ: 生育の遅れている株がないか個体差を観察。' },
            { day: 55, url: 'https://upload.wikimedia.org/wikipedia/commons/6/64/Arachis_hypogaea_Flower.jpg', label: '開花期', note: '作業: 追肥を行い、株元を軽く中耕。\n天候: 高温多湿、開花には好条件。\n生育: 黄色い花が次々と咲き始める。\nメモ: 開花後、子房柄が地中に潜る様子を継続観察。' },
            { day: 85, url: 'https://upload.wikimedia.org/wikipedia/commons/4/4a/Peanut_9417.jpg', label: '莢形成期', note: '作業: 子房柄がしっかり土に入るよう株元に土寄せ。\n天候: 安定した晴天が続く。\n生育: 地中で莢が肥大し始めている。\nメモ: 過湿にならないよう排水状態を確認。' },
            { day: 135, url: 'https://upload.wikimedia.org/wikipedia/commons/f/fb/Peanuts_%28Arachis_hypogaea%29_-_in_shell%2C_shell_cracked_open%2C_shelled%2C_peeled.jpg', label: '収穫', note: '作業: 試し掘りで莢の充実を確認後、株ごと掘り取り。\n天候: 晴天が続くタイミングを選んで実施。\n収量: 大粒でしっかり充実した莢が多かった。\nメモ: 掘り取り後は畑で数日乾燥させてから脱莢。' }
          ],
          below: 'https://upload.wikimedia.org/wikipedia/commons/f/fb/Peanuts_%28Arachis_hypogaea%29_-_in_shell%2C_shell_cracked_open%2C_shelled%2C_peeled.jpg',
          daysToHarvest: 135
        },
        sweetpotato: {
          aboveStages: [
            { day: 0, url: 'https://upload.wikimedia.org/wikipedia/commons/a/a7/Sweet_potato_sprouting_slips.jpg', label: '苗（挿し苗）定植', note: '作業: 高畝を立ててマルチを張り、挿し苗を斜め植え。\n天候: 曇りがちな日を選んで定植（活着を良くするため）。\n土壌: 排水性を高めるため畝を高めに設定。\nメモ: 定植直後はしおれやすいので数日は朝晩の様子を確認。' },
            { day: 35, url: 'https://upload.wikimedia.org/wikipedia/commons/c/c4/Ipomoea_batatas_leaf.jpg', label: '葉の展開', note: '作業: 地面に張り付き始めたつるを持ち上げる「つる返し」を実施。\n天候: 晴れの日が多く、生育は順調。\n生育: 葉が急速に増え、株間を覆い始める。\nメモ: 除草も合わせて実施し、風通しを確保。' },
            { day: 65, url: 'https://upload.wikimedia.org/wikipedia/commons/9/9e/Sweet_Potato_Flower_in_Full_bloom.jpg', label: '開花期', note: '作業: 控えめに追肥し、つる返しを継続。\n天候: 高温が続くが、水はけが良く順調。\n生育: 一部の株で花が見られる（着蕾は少なめ）。\nメモ: 肥料の与えすぎは「つるボケ」の原因になるため注意。' },
            { day: 100, url: 'https://upload.wikimedia.org/wikipedia/commons/4/43/Sweet_potato_field_in_Namegata%2C_Ibaraki_07.jpg', label: '繁茂期', note: '作業: つるが畝全体を覆い、最後のつる返しを実施。\n天候: 秋雨前線の影響で降雨あり、排水路を再確認。\n生育: 地上部は繁茂のピーク、地下のいもも肥大中。\nメモ: 収穫時期を見極めるため試し掘りを検討。' },
            { day: 140, url: 'https://upload.wikimedia.org/wikipedia/commons/4/45/Sweet_potatoes.JPG', label: '収穫', note: '作業: 晴天が続いたタイミングでつるを刈り、いもを掘り取り。\n天候: 快晴、掘り取り日和。\n収量: 大きさのそろった芋を多数収穫。\nメモ: 掘り取り後はキュアリング（貯蔵前の傷口保護）を行う予定。' }
          ],
          below: 'https://upload.wikimedia.org/wikipedia/commons/4/45/Sweet_potatoes.JPG',
          daysToHarvest: 140
        }
      };

      const TIME_SLIDER_MAX_DAY = 150;

      // 経過日数(day)から、その時点で表示すべき地上部ステージを選ぶ（Googleストリートビューの
      // 「過去の画像」選択と同じ考え方：指定日以前で一番新しいステージを採用）
      function pickStage(ridge, day) {
        const stages = ridge.photos.aboveStages;
        let chosen = stages[0];
        for (const s of stages) {
          if (s.day <= day) chosen = s; else break;
        }
        const growth = Math.min(Math.max(day / ridge.photos.daysToHarvest, 0), 1);
        return { above: chosen.url, below: ridge.photos.below, growth, label: chosen.label, note: chosen.note };
      }

      const ridgeData = [
        {
          ridgeNo: 1, posX: -1.5,
          crop: "ジャガイモ", variety: "デジマ",
          plantedDate: "2026-03-10", status: "収穫間近",
          soilColor: "#3E2723", labelColor: "#D81B60",
          photos: CROP_PHOTOS.potato,
          // 将来.glbへ差し替える場合は modelUrl に相対パスを入れるだけでよい（例: "models/potato-degima.glb"）
          modelUrl: null, modelId: "model-potato-degima", modelScale: "1 1 1"
        },
        {
          ridgeNo: 2, posX: 0,
          crop: "落花生", variety: "おおまさりネオ",
          plantedDate: "2026-05-10", status: "開花期",
          soilColor: "#212121", labelColor: "#2E7D32",
          photos: CROP_PHOTOS.peanut,
          modelUrl: null, modelId: "model-peanut-oomasari", modelScale: "1 1 1"
        },
        {
          ridgeNo: 3, posX: 1.5,
          crop: "サツマイモ", variety: "べにはるか",
          plantedDate: "2026-05-02", status: "蔓繁茂",
          soilColor: "#3E2723", labelColor: "#880E4F",
          photos: CROP_PHOTOS.sweetpotato,
          modelUrl: null, modelId: "model-sweetpotato", modelScale: "1 1 1"
        }
      ];

      // ------------------------------------------------------------------
      // 生育度合い・収穫予測日の計算（定植日 + 作物ごとの目安日数）
      // ------------------------------------------------------------------
      function formatDate(d) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }

      function computeGrowth(ridge) {
        const DAY_MS = 24 * 60 * 60 * 1000;
        const plantedMs = new Date(ridge.plantedDate).getTime();
        const nowMs = Date.now();
        const daysToHarvest = ridge.photos.daysToHarvest;
        const daysSince = (nowMs - plantedMs) / DAY_MS;
        const progress = Math.min(Math.max(daysSince / daysToHarvest, 0), 1);
        const harvestMs = plantedMs + daysToHarvest * DAY_MS;
        const daysUntilHarvest = Math.ceil((harvestMs - nowMs) / DAY_MS);
        const harvestDateLabel = formatDate(new Date(harvestMs));
        const harvestLabel = daysUntilHarvest > 0
          ? `収穫予測 ${harvestDateLabel}（あと${daysUntilHarvest}日）`
          : `収穫適期 ${harvestDateLabel}（収穫可能）`;
        return {
          progress,
          daysSince: Math.max(daysSince, 0),
          harvestDateLabel,
          daysUntilHarvest,
          harvestLabel
        };
      }

      // ------------------------------------------------------------------
      // 日本語看板コンポーネント（品種／ステータス／収穫予測＋生育バーの3段組み）
      // ------------------------------------------------------------------
      AFRAME.registerComponent('jp-text', {
        schema: {
          title: { type: 'string', default: '' },
          subtitle: { type: 'string', default: '' },
          harvest: { type: 'string', default: '' },
          progress: { type: 'number', default: 0 },
          color: { type: 'string', default: '#333333' }
        },
        init: function () {
          const canvas = document.createElement('canvas');
          canvas.width = 512;
          canvas.height = 300;
          const ctx = canvas.getContext('2d');

          ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
          if (ctx.roundRect) {
            ctx.roundRect(10, 10, 492, 280, 20);
          } else {
            ctx.fillRect(10, 10, 492, 280);
          }
          ctx.fill();
          ctx.lineWidth = 8;
          ctx.strokeStyle = this.data.color;
          ctx.stroke();

          ctx.fillStyle = this.data.color;
          ctx.font = 'bold 32px "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(this.data.title, 256, 75);

          ctx.fillStyle = '#444444';
          ctx.font = '21px "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif';
          ctx.fillText(this.data.subtitle, 256, 130);

          ctx.fillStyle = '#00695C';
          ctx.font = 'bold 19px "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif';
          ctx.fillText(this.data.harvest, 256, 170);

          // 生育度合いバー
          const barX = 56, barY = 200, barW = 400, barH = 22;
          ctx.fillStyle = '#E0E0E0';
          if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(barX, barY, barW, barH, 11); ctx.fill(); }
          else { ctx.fillRect(barX, barY, barW, barH); }
          const p = Math.min(Math.max(this.data.progress, 0), 1);
          ctx.fillStyle = this.data.color;
          if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(barX, barY, barW * p, barH, 11); ctx.fill(); }
          else { ctx.fillRect(barX, barY, barW * p, barH); }
          ctx.fillStyle = '#333333';
          ctx.font = '16px "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif';
          ctx.fillText(`生育度 ${Math.round(p * 100)}%`, 256, barY + barH + 26);

          const texture = new THREE.CanvasTexture(canvas);
          const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
          const geometry = new THREE.PlaneGeometry(1.4, 0.82);
          const mesh = new THREE.Mesh(geometry, material);
          this.el.setObject3D('mesh', mesh);
        }
      });

      // ------------------------------------------------------------------
      // 影のみを落とす「地面」（実カメラ映像を隠さないよう、影以外は透明）
      // ------------------------------------------------------------------
      AFRAME.registerComponent('shadow-ground', {
        schema: { width: { type: 'number', default: 10 }, depth: { type: 'number', default: 10 }, opacity: { type: 'number', default: 0.35 } },
        init: function () {
          const geometry = new THREE.PlaneGeometry(this.data.width, this.data.depth);
          const material = new THREE.ShadowMaterial({ opacity: this.data.opacity });
          const mesh = new THREE.Mesh(geometry, material);
          mesh.rotation.x = -Math.PI / 2;
          mesh.receiveShadow = true;
          this.el.setObject3D('mesh', mesh);
        }
      });

      // ------------------------------------------------------------------
      // 写真ベースの作物ビルボード（地上部＋地下部）
      // 円柱・球体などのプリミティブ図形の代わりに、実際の作物写真を
      // 常にカメラを向く板（スプライト）として表示する。
      // 生育度合い(0〜1)に応じて、地上部は徐々に育ち、地下部（芋・さや）は
      // 後半になるほど大きく膨らむようにスケールを変化させる。
      // 将来的に本物の.glbモデルに差し替える場合は、呼び出し側でこの
      // コンポーネントの代わりに gltf-model を使う分岐に切り替えればよい。
      // ------------------------------------------------------------------
      const PHOTO_TEXTURE_CACHE = new Map(); // 同じ写真URLの再読み込みを避けるキャッシュ

      AFRAME.registerComponent('photo-billboard', {
        schema: {
          above: { type: 'string' },
          below: { type: 'string' },
          growth: { type: 'number', default: 0.5 }
        },
        init: function () {
          this.aboveSprite = null;
          this.belowSprite = null;
          this.currentAbove = null;
          this.currentBelow = null;
          this.setAbove(this.data.above);
          this.setBelow(this.data.below);
        },
        update: function () {
          this.updateScales();
        },
        // タイムスライダーからの呼び出し用：地上部の写真・地下部の写真・生育度をまとめて切り替える
        applyStage: function (aboveUrl, belowUrl, growth) {
          this.data.growth = growth;
          this.setAbove(aboveUrl);
          this.setBelow(belowUrl);
          this.updateScales();
        },
        setAbove: function (url) {
          if (!url || url === this.currentAbove) return;
          this.currentAbove = url;
          this.loadRoundTexture(url).then((texture) => {
            if (this.currentAbove !== url) return; // 読み込み中にさらに切り替わっていたら破棄
            if (this.aboveSprite) {
              this.aboveSprite.material.map = texture;
              this.aboveSprite.material.needsUpdate = true;
            } else {
              this.aboveSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
              this.el.setObject3D('above-sprite', this.aboveSprite);
            }
            this.updateScales();
          });
        },
        setBelow: function (url) {
          if (!url || url === this.currentBelow) return;
          this.currentBelow = url;
          this.loadRoundTexture(url).then((texture) => {
            if (this.currentBelow !== url) return;
            if (this.belowSprite) {
              this.belowSprite.material.map = texture;
              this.belowSprite.material.needsUpdate = true;
            } else {
              this.belowSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: true }));
              this.el.setObject3D('below-sprite', this.belowSprite);
            }
            this.updateScales();
          });
        },
        updateScales: function () {
          // サイズは生育度によらず固定。時系列スライダーでは「写真の切り替え」だけで表現する
          const ABOVE_SIZE = 1.1;
          const BELOW_SIZE = 0.7;

          if (this.aboveSprite) {
            this.aboveSprite.scale.set(ABOVE_SIZE, ABOVE_SIZE, 1);
            this.aboveSprite.position.set(0, 0.08 + ABOVE_SIZE * 0.4, 0);
          }
          if (this.belowSprite) {
            this.belowSprite.scale.set(BELOW_SIZE, BELOW_SIZE * 0.75, 1);
            this.belowSprite.position.set(0, 0.05 + BELOW_SIZE * 0.05, 0);
          }
        },
        loadRoundTexture: function (url) {
          if (PHOTO_TEXTURE_CACHE.has(url)) {
            return PHOTO_TEXTURE_CACHE.get(url);
          }
          const promise = new Promise((resolve) => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
              const size = 256;
              const canvas = document.createElement('canvas');
              canvas.width = size;
              canvas.height = size;
              const ctx = canvas.getContext('2d');
              ctx.save();
              ctx.beginPath();
              ctx.ellipse(size / 2, size / 2, size * 0.48, size * 0.42, 0, 0, Math.PI * 2);
              ctx.clip();
              const scale = Math.max(size / img.width, size / img.height);
              const w = img.width * scale, h = img.height * scale;
              ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
              ctx.restore();
              resolve(new THREE.CanvasTexture(canvas));
            };
            img.onerror = () => {
              console.error('作物写真の読み込みに失敗しました', url);
              resolve(null);
            };
            img.src = url;
          });
          PHOTO_TEXTURE_CACHE.set(url, promise);
          return promise;
        }
      });

      // ------------------------------------------------------------------
      // カメラ映像をフルスクリーン背景として表示する（マーカー無し・簡易パススルー版）
      // ------------------------------------------------------------------
      async function initCameraPassthrough() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' } },
            audio: false
          });
          document.querySelector('#ar-video').srcObject = stream;
        } catch (err) {
          console.error('カメラ映像の取得に失敗しました', err);
        }
      }

      // ------------------------------------------------------------------
      // 2本指スワイプでカメラを移動する（横=左右移動、縦=前後移動）
      // ------------------------------------------------------------------
      AFRAME.registerComponent('twofinger-pan', {
        schema: { speed: { default: 0.01 } },
        init: function () {
          this.lastCenter = null;
          const getCenter = (touches) => ({
            x: (touches[0].pageX + touches[1].pageX) / 2,
            y: (touches[0].pageY + touches[1].pageY) / 2
          });
          window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
              e.preventDefault();
              this.lastCenter = getCenter(e.touches);
            }
          }, { passive: false });
          window.addEventListener('touchmove', (e) => {
            if (e.touches.length !== 2 || !this.lastCenter) return;
            // iOS Safariがuser-scalable=noを無視してページ自体をズーム/パンしようとするのを止める
            e.preventDefault();
            const center = getCenter(e.touches);
            const dx = center.x - this.lastCenter.x;
            const dy = center.y - this.lastCenter.y;
            this.lastCenter = center;

            // カメラの向きに合わせた「左右」「前後」方向ベクトル（水平面のみ）
            const quat = this.el.object3D.quaternion;
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(quat);
            forward.y = 0; forward.normalize();
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(quat);
            right.y = 0; right.normalize();

            const pos = this.el.object3D.position;
            // Googleマップ等と同じ「指でつまんで動かす」向き（コンテンツが指に追従する）
            pos.addScaledVector(right, -dx * this.data.speed);
            pos.addScaledVector(forward, dy * this.data.speed);
          }, { passive: false });
          window.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) this.lastCenter = null;
          }, { passive: false });
        }
      });

      // ------------------------------------------------------------------
      // ピンチ操作で圃場全体（farm-root）を拡大縮小する
      // ------------------------------------------------------------------
      AFRAME.registerComponent('pinch-scale', {
        schema: { min: { default: 0.3 }, max: { default: 3 } },
        init: function () {
          this.initialDist = 0;
          this.initialScale = this.el.object3D.scale.x || 1;
          const dist = (touches) => Math.hypot(
            touches[0].pageX - touches[1].pageX,
            touches[0].pageY - touches[1].pageY
          );
          window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
              e.preventDefault();
              this.initialDist = dist(e.touches);
              this.initialScale = this.el.object3D.scale.x;
            }
          }, { passive: false });
          window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && this.initialDist > 0) {
              // iOS Safariがuser-scalable=noを無視してページ自体をズームしようとするのを止める
              e.preventDefault();
              const factor = dist(e.touches) / this.initialDist;
              const s = Math.min(Math.max(this.initialScale * factor, this.data.min), this.data.max);
              this.el.object3D.scale.set(s, s, s);
            }
          }, { passive: false });
          window.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) this.initialDist = 0;
          }, { passive: false });
        }
      });

      // ------------------------------------------------------------------
      // データ配列 → A-Frameエンティティを動的生成
      // ------------------------------------------------------------------
      function buildRidgeEntity(ridge) {
        const ridgeEl = document.createElement('a-entity');
        ridgeEl.setAttribute('position', `${ridge.posX} 0 -4.5`);
        ridgeEl.setAttribute('data-ridge-no', ridge.ridgeNo);
        ridgeEl.setAttribute('data-crop', ridge.crop);
        ridgeEl.setAttribute('data-variety', ridge.variety);
        ridgeEl.setAttribute('data-planted-date', ridge.plantedDate);
        ridgeEl.setAttribute('data-status', ridge.status);

        const growth = computeGrowth(ridge);

        // 畝（固定畝・不耕起栽培の土台）
        const soil = document.createElement('a-box');
        soil.setAttribute('position', '0 0.05 0');
        soil.setAttribute('width', '0.7');
        soil.setAttribute('height', '0.1');
        soil.setAttribute('depth', String(FIELD_DEPTH));
        soil.setAttribute('color', ridge.soilColor);
        soil.setAttribute('shadow', 'receive: true; cast: false');
        ridgeEl.appendChild(soil);

        // 日本語看板（品種／ステータス／収穫予測＋生育バー）
        const label = document.createElement('a-entity');
        label.setAttribute('position', '0 1.9 2.5');
        label.setAttribute(
          'jp-text',
          `title: 畝${String(ridge.ridgeNo).padStart(2, '0')}: ${ridge.variety};` +
          `subtitle: ${ridge.status}（定植 ${ridge.plantedDate}）;` +
          `harvest: ${growth.harvestLabel};` +
          `progress: ${growth.progress};` +
          `color: ${ridge.labelColor}`
        );
        ridgeEl.appendChild(label);

        // 作物オブジェクト：写真ビルボード（地上部＋地下部）。modelUrl設定時は本物の.glbに差し替え
        ITEM_Z_POSITIONS.forEach((z, index) => {
          const itemWrap = document.createElement('a-entity');
          const baseY = 0;
          // 株ごとに生育のばらつきを少し持たせる（±5%）
          const jitter = 1 + (((index * 37 + ridge.ridgeNo * 13) % 10) - 5) / 100;

          itemWrap.setAttribute('position', `0 ${baseY} ${z}`);
          itemWrap.setAttribute('data-ridge-no', ridge.ridgeNo);
          itemWrap.setAttribute('data-jitter', jitter);
          itemWrap.setAttribute('class', 'tappable'); // タップ検知(initTapToZoom)の対象マーカー
          // ゆったりとした上下の揺れ（地上部の茎葉だけがそよぐ質感付け。地下部の位置は photo-billboard 側で固定）
          itemWrap.setAttribute(
            'animation__bob',
            `property: position; to: 0 ${(baseY + 0.03).toFixed(2)} ${z}; dir: alternate; loop: true; dur: 4000; easing: easeInOutSine`
          );

          if (ridge.modelUrl) {
            // 外部.glbモデルがある場合はそちらを使用
            itemWrap.setAttribute('gltf-model', `#${ridge.modelId}`);
            itemWrap.setAttribute('scale', ridge.modelScale);
            itemWrap.setAttribute('shadow', 'cast: true; receive: false');
          } else {
            // 未設定の間は実写真ベースのビルボードで代用。初期表示は「実際の定植日からの経過日数」に基づく
            const stage = pickStage(ridge, growth.daysSince * jitter);
            itemWrap.setAttribute(
              'photo-billboard',
              `above: ${stage.above}; below: ${stage.below}; growth: ${stage.growth}`
            );
          }
          ridgeEl.appendChild(itemWrap);
        });

        return ridgeEl;
      }

      function initFarmScene() {
        const assetsEl = document.querySelector('a-assets');
        const farmRoot = document.querySelector('#farm-root');

        // modelUrlが設定されている作物だけ、動的に<a-asset-item>を登録する
        ridgeData.forEach((ridge) => {
          if (ridge.modelUrl) {
            const assetItem = document.createElement('a-asset-item');
            assetItem.setAttribute('id', ridge.modelId);
            assetItem.setAttribute('src', ridge.modelUrl);
            assetsEl.appendChild(assetItem);
          }
        });

        ridgeData.forEach((ridge) => {
          farmRoot.appendChild(buildRidgeEntity(ridge));
        });
      }

      // ------------------------------------------------------------------
      // 時系列タイムスライダー（Googleストリートビューの「過去の画像」風に、
      // 定植からの経過日数をスクラブして全畝の見た目を一括で切り替える）
      // ------------------------------------------------------------------
      function applyTimeSliderDay(day) {
        document.querySelectorAll('#farm-root [data-ridge-no]').forEach((el) => {
          const ridgeNo = parseInt(el.getAttribute('data-ridge-no'), 10);
          const jitter = parseFloat(el.getAttribute('data-jitter')) || 1;
          const ridge = ridgeData.find((r) => r.ridgeNo === ridgeNo);
          if (!ridge || ridge.modelUrl) return;
          const stage = pickStage(ridge, day * jitter);
          const comp = el.components && el.components['photo-billboard'];
          if (comp) comp.applyStage(stage.above, stage.below, stage.growth);
        });
        const readout = document.querySelector('#day-readout');
        if (readout) readout.textContent = `定植から ${day}日目`;
        updateLightboxIfOpen();
      }

      function initTimeSlider() {
        const slider = document.querySelector('#day-slider');
        if (!slider) return;
        // 初期値：各畝の実際の経過日数の中央値に近い値にしておく（見た目のジャンプを減らすため）
        const daysList = ridgeData.map((r) => Math.min(computeGrowth(r).daysSince, TIME_SLIDER_MAX_DAY));
        daysList.sort((a, b) => a - b);
        const initialDay = Math.round(daysList[Math.floor(daysList.length / 2)] || 60);
        slider.value = initialDay;
        document.querySelector('#day-readout').textContent = `定植から ${initialDay}日目`;
        slider.addEventListener('input', (e) => applyTimeSliderDay(parseInt(e.target.value, 10)));
      }

      // ------------------------------------------------------------------
      // ライトボックス：作物写真をタップすると、丸トリミングを解除した元画像を
      // 拡大表示する。下のタイムスライダーと同じ「経過日数」を共有しており、
      // スワイプでスライダー自体も一緒に動く。ただし開くときだけは必ず
      // 一番古い状態（定植直後 = 0日目）にスライダーごと戻してから表示する。
      // ------------------------------------------------------------------
      let lightboxRidgeNo = null;

      function currentSliderDay() {
        const slider = document.querySelector('#day-slider');
        return slider ? parseInt(slider.value, 10) : 0;
      }

      function openLightbox(ridgeNo) {
        const ridge = ridgeData.find((r) => r.ridgeNo === ridgeNo);
        if (!ridge || ridge.modelUrl) return;
        lightboxRidgeNo = ridgeNo;
        const slider = document.querySelector('#day-slider');
        if (slider) slider.value = 0;
        applyTimeSliderDay(0); // スライダー・全畝の見た目・ライトボックスをまとめて0日目に
        document.querySelector('#lightbox').style.display = 'flex';
      }

      function closeLightbox() {
        lightboxRidgeNo = null;
        document.querySelector('#lightbox').style.display = 'none';
      }

      function updateLightboxIfOpen() {
        if (lightboxRidgeNo === null) return;
        const ridge = ridgeData.find((r) => r.ridgeNo === lightboxRidgeNo);
        if (!ridge) return;
        const stage = pickStage(ridge, currentSliderDay());
        document.querySelector('#lightbox-img').src = stage.above;
        document.querySelector('#lightbox-caption').textContent =
          `畝${String(ridge.ridgeNo).padStart(2, '0')}: ${ridge.variety}｜${stage.label}`;
        document.querySelector('#lightbox-note').textContent = stage.note || '';
      }

      function initLightbox() {
        document.querySelector('#lightbox-close').addEventListener('click', closeLightbox);
        document.querySelector('#lightbox').addEventListener('click', (e) => {
          if (e.target.id === 'lightbox') closeLightbox(); // 背景タップで閉じる
        });
      }

      // 拡大写真を左右にスワイプすると、次/前の生育段階に切り替わる（Googleストリートビューの日付送りと同じ感覚）。
      // 下のタイムスライダーも連動して動く。
      function stepLightboxStage(direction) {
        if (lightboxRidgeNo === null) return;
        const ridge = ridgeData.find((r) => r.ridgeNo === lightboxRidgeNo);
        if (!ridge || ridge.modelUrl) return;
        const stages = ridge.photos.aboveStages;
        const day = currentSliderDay();
        let idx = 0;
        for (let i = 0; i < stages.length; i++) {
          if (stages[i].day <= day) idx = i;
        }
        const newIdx = Math.max(0, Math.min(stages.length - 1, idx + direction));
        const newDay = stages[newIdx].day;
        const slider = document.querySelector('#day-slider');
        if (slider) slider.value = newDay;
        applyTimeSliderDay(newDay);
      }

      function initLightboxSwipe() {
        const lightboxEl = document.querySelector('#lightbox');
        let start = null;
        lightboxEl.addEventListener('touchstart', (e) => {
          start = e.touches.length === 1
            ? { x: e.touches[0].clientX, y: e.touches[0].clientY }
            : null;
        }, { passive: true });
        lightboxEl.addEventListener('touchend', (e) => {
          if (!start || e.changedTouches.length !== 1) { start = null; return; }
          const dx = e.changedTouches[0].clientX - start.x;
          const dy = e.changedTouches[0].clientY - start.y;
          start = null;
          // 横方向に十分大きく動いた場合だけスワイプとみなす（縦の指ブレは無視）
          if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
          stepLightboxStage(dx < 0 ? 1 : -1); // 左スワイプ＝次の段階、右スワイプ＝前の段階
        }, { passive: true });
      }

      // ------------------------------------------------------------------
      // 作物写真のタップ検知（自前実装）。
      // A-Frameのcursor/raycasterコンポーネントはスプライトに対する
      // マウス系イベント連携が不安定なため、指1本の短いタップだけを
      // 自前で判定し、THREE.Raycasterで直接スプライトに当たり判定を取る。
      // ------------------------------------------------------------------
      function initTapToZoom() {
        const sceneEl = document.querySelector('a-scene');
        let touchStart = null;

        window.addEventListener('touchstart', (e) => {
          touchStart = e.touches.length === 1
            ? { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() }
            : null;
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
          if (!touchStart || e.changedTouches.length !== 1) { touchStart = null; return; }
          const dx = e.changedTouches[0].clientX - touchStart.x;
          const dy = e.changedTouches[0].clientY - touchStart.y;
          const isTap = Math.hypot(dx, dy) < 12 && (Date.now() - touchStart.t) < 400;
          const pos = touchStart;
          touchStart = null;
          if (isTap) handleTap(pos.x, pos.y);
        }, { passive: true });

        function handleTap(clientX, clientY) {
          const camera = sceneEl.camera;
          if (!camera) return;
          const rect = sceneEl.canvas.getBoundingClientRect();
          const ndc = new THREE.Vector2(
            ((clientX - rect.left) / rect.width) * 2 - 1,
            -((clientY - rect.top) / rect.height) * 2 + 1
          );
          const raycaster = new THREE.Raycaster();
          raycaster.camera = camera; // THREE.Sprite の当たり判定にはcameraの明示指定が必須
          raycaster.setFromCamera(ndc, camera);
          const targets = Array.from(document.querySelectorAll('.tappable')).map((el) => el.object3D);
          const hits = raycaster.intersectObjects(targets, true);
          if (!hits.length) return;
          let obj = hits[0].object;
          while (obj) {
            if (obj.el && obj.el.hasAttribute && obj.el.hasAttribute('data-ridge-no')) {
              openLightbox(parseInt(obj.el.getAttribute('data-ridge-no'), 10));
              return;
            }
            obj = obj.parent;
          }
        }
      }

      document.addEventListener('DOMContentLoaded', initFarmScene);
      document.addEventListener('DOMContentLoaded', initCameraPassthrough);
      document.addEventListener('DOMContentLoaded', initTimeSlider);
      document.addEventListener('DOMContentLoaded', initLightbox);
      document.addEventListener('DOMContentLoaded', initLightboxSwipe);
      document.addEventListener('DOMContentLoaded', initTapToZoom);
      document.addEventListener('DOMContentLoaded', initSpriteRaycastFix);
    </script>
  </head>

  <body style="margin: 0; overflow: hidden; background: #000; touch-action: none;">
    <!--
      簡易パススルーAR（マーカー・GPSなし版）:
      背面カメラの映像を全画面の<video>として敷き、その上に透明背景の
      A-Frameシーンを重ねて3Dオブジェクトを合成表示するだけの構成。
      「マーカーが常に検出され続けている」のと同じ状態を疑似的に作っている。

      本番運用では、圃場入口の看板などに対応させた画像マーカー（AR.js等）や、
      屋外の広い範囲をカバーできるGPS座標ベースのアンカリング（gps-camera /
      gps-entity-place 等）に置き換えることを想定。
    -->
    <video id="ar-video" autoplay muted playsinline
      style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0;"></video>

    <a-scene
      vr-mode-ui="enabled: false"
      renderer="antialias: true; alpha: true; physicallyCorrectLights: true"
      shadow="type: pcfsoft"
      embedded
      style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: transparent;"
    >
      <!-- 3Dアセット置き場：将来ここに畝ごとの.glbモデルを登録していく -->
      <a-assets timeout="5000"></a-assets>

      <!-- 通路視点。スマホを傾けると視点も動く（magicWindowTrackingEnabled） -->
      <!-- touchEnabled: false でlook-controls自身のタッチドラッグ回転を無効化し、2本指パンと競合しないようにする -->
      <!-- 作物写真のタップ判定はinitTapToZoom()が自前のTHREE.Raycasterで行う（cursor/raycasterコンポーネントは不使用） -->
      <a-entity camera position="0 1.6 1.5" look-controls="magicWindowTrackingEnabled: true; touchEnabled: false" twofinger-pan></a-entity>

      <a-light light="type: ambient; color: #FFFFFF; intensity: 0.7"></a-light>
      <a-light
        light="type: directional; color: #FFFFFF; intensity: 0.9; castShadow: true; shadowCameraFar: 20; shadowCameraLeft: -6; shadowCameraRight: 6; shadowCameraTop: 6; shadowCameraBottom: -6; shadowBias: -0.001"
        position="-2 5 2"
      ></a-light>

      <!-- ピンチで拡大縮小できる圃場全体のルート。中身はJSONデータから自動生成 -->
      <a-entity id="farm-root" pinch-scale scale="1 1 1">
        <a-entity shadow-ground="width: 10; depth: 10" position="0 0 -4.5"></a-entity>
      </a-entity>
    </a-scene>

    <!--
      時系列タイムスライダー（Googleストリートビューの「過去の画像」風UI）。
      touch-action: auto でこの要素だけは通常のタッチ操作（スライダー操作）を許可する。
      TODO: 将来、自分で撮影した写真をアップロードする段になったら、
            このバーに「この日の写真を追加」ボタンを追加する想定。
    -->
    <div style="position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; background: rgba(0,0,0,0.55); color: #fff; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); font-family: -apple-system, 'Hiragino Kaku Gothic ProN', sans-serif; touch-action: auto;">
      <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; opacity: 0.9;">
        <span>生育タイムトラベル</span>
        <span id="day-readout">定植から 0日目</span>
      </div>
      <input id="day-slider" type="range" min="0" max="150" value="60" step="1"
        style="width: 100%; touch-action: auto;">
    </div>

    <!-- ライトボックス：写真をタップすると丸トリミングを解除した元画像を拡大表示。タイムスライダーは開いたまま操作できる -->
    <div id="lightbox" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 66px; z-index: 5; background: rgba(0,0,0,0.88); align-items: center; justify-content: flex-start; flex-direction: column; touch-action: auto; overflow-y: auto; padding: 16px 0 24px;">
      <button id="lightbox-close" style="position: fixed; top: 12px; right: 16px; width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,255,255,0.15); color: #fff; font-size: 20px; touch-action: auto; z-index: 1;">✕</button>
      <img id="lightbox-img" style="max-width: 92%; max-height: 46vh; object-fit: contain; border-radius: 8px; margin-top: 36px;">
      <div id="lightbox-caption" style="color: #fff; margin-top: 14px; font-family: -apple-system, 'Hiragino Kaku Gothic ProN', sans-serif; font-size: 16px; font-weight: bold;"></div>
      <div id="lightbox-note" style="color: #f0f0f0; margin-top: 10px; width: 88%; max-width: 440px; background: rgba(255,255,255,0.08); border-radius: 10px; padding: 12px 16px; font-family: -apple-system, 'Hiragino Kaku Gothic ProN', sans-serif; font-size: 13px; line-height: 1.7; white-space: pre-line; text-align: left;"></div>
      <div style="color: #999; margin-top: 12px; font-family: -apple-system, 'Hiragino Kaku Gothic ProN', sans-serif; font-size: 12px;">← スワイプで生育の記録をめくれます →</div>
    </div>
  </body>
</html>
